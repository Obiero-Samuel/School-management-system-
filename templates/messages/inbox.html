{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Inbox</h2>
  <a href="{{ url_for('send_message') }}" class="btn btn-primary mb-3">Compose Message</a>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>From</th><th>Subject</th><th>Message</th><th>Date</th>
      </tr>
    </thead>
    <tbody>
      {% for msg in messages %}
      <tr {% if not msg.is_read %}class="table-info"{% endif %}>
        <td>{{ msg.sender_username }}</td>
        <td>{{ msg.subject }}</td>
        <td>{{ msg.body }}</td>
        <td>{{ msg.sent_at }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
