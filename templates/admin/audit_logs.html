{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Audit Logs</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>User</th><th>Action</th><th>Details</th><th>Timestamp</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.username }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.details }}</td>
        <td>{{ log.timestamp }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
